name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  test:
    uses: ./.github/workflows/go-test.yaml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  release:
    needs: test
    runs-on: ubuntu-latest
    # The protected "release" environment holds the MSIGN_PRIVATE secret.
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Build, sign and checksum
        env:
          MSIGN_PRIVATE: ${{ secrets.MSIGN_PRIVATE }}
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/msign-*-amd64
            bin/msign-*-arm64
            bin/msign-*.exe
            bin/SHA256SUMS
      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag ${prerelease} \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md bin/*
      - name: Check uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir uploaded
          gh release download "${GITHUB_REF_NAME}" --dir uploaded
          (cd uploaded && sha256sum -c SHA256SUMS)
          build/host/msign verify -q --public keys/release.pub uploaded/SHA256SUMS
          test "$(ls uploaded | wc -l)" -eq "$(ls bin | wc -l)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
